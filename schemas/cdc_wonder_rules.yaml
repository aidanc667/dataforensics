# CDC WONDER Export Rules -- verified against a real export
#
# Real export: Underlying Cause of Death, 1999-2020, grouped by County,
# Colorado, 2020 (data/raw/cdc_wonder_export.tsv), pulled 2026-08-27 from
# https://wonder.cdc.gov/ucd-icd10.html. 65 rows (64 counties + a "Total"
# summary row CDC WONDER appends by default).
#
# "County Code" is the real column name for the 5-digit county FIPS
# (e.g. "08001") and is used as primary_key instead of the template's
# placeholder county_fips -- it's genuinely unique per county, and empty
# for the "Total" row (which has no single county), so it also doubles as
# a natural flag for that row via non-numeric/blank detection.
#
# "Deaths" and "Population" are thousands-comma-formatted in the raw
# export (e.g. "3,703"), so this tool's own numeric detection correctly
# does NOT treat them as numeric as-is (a comma inside the value fails
# float() parsing) -- see WRITEUP.md for what this means in practice.

version: 1
primary_key: [County Code]
columns:
  Deaths:
    type: integer
    minimum: 0
    # No maximum: county population varies from ~800 (Hinsdale) to
    # ~735,000 (Denver), so a single fixed ceiling isn't meaningful.
missing_values:
  Deaths:
    "Suppressed": "Suppressed (small-cell, per WONDER confidentiality policy: fewer than 10 deaths)"
  Crude Rate:
    "Suppressed": "Suppressed (small-cell, per WONDER confidentiality policy)"
    "Unreliable": "Unreliable (rate calculated from a numerator of 20 or fewer deaths)"
category_mappings: {}
weights_strata:
  columns: []
