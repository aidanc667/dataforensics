# CDC WONDER / ACS PUMS Crosswalk Template
#
# IMPORTANT: This is a DRAFT TEMPLATE showing the structure for harmonizing CDC WONDER and ACS PUMS.
# The column names and value mappings below are PLACEHOLDERS derived from typical exports.
# Once you download real data in Steps 1-2 of Task 17:
#   1. Identify the exact column names in each export (step names differ between sources)
#   2. Update column_map entries to map each source's actual columns to common target columns
#   3. Update value_map entries to match the actual coded values in your exports
#   4. The harmonization targets (geography_fips, age_band, sex) should remain consistent
#      across both sources so they can be joined or compared
#
# The crosswalk is used by: rdh harmonize --crosswalk schemas/wonder_pums_crosswalk.yaml
# See: Task 17 Step 7 for the full harmonize command.
# This file must parse cleanly and match the structure validated in tests/integration/test_crosswalk.py

version: 1
sources:
  cdc_wonder_export:
    column_map:
      county_fips: geography_fips  # Maps WONDER's grouping column to harmonized target
      age_group: age_band           # Maps WONDER's age grouping to harmonized target
      sex: sex                      # Maps WONDER's sex column to harmonized target
    value_map: {}                   # CDC WONDER usually has text labels; adjust if coded values appear
  acs_pums_extract:
    column_map:
      PUMA: geography_fips          # Public Use Microdata Area -> harmonized geography identifier
      AGEP: age_band                # PUMS age -> harmonized age band (may need bucketing logic outside this file)
      SEX: sex                      # PUMS sex code -> harmonized sex
    value_map:
      SEX:
        "1": M                       # ACS codes: 1=Male
        "2": F                       # ACS codes: 2=Female
