name: Keep app awake

on:
  schedule:
    # Every 6 hours -- comfortably inside Streamlit Community Cloud's 12-hour
    # inactivity sleep window, with margin for a delayed/skipped run.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app in a real browser
        run: python .github/scripts/keep_app_awake.py
