name: Keep app awake

on:
  schedule:
    # Every 3 hours at :17. Streamlit Community Cloud sleeps an app after 12
    # hours without traffic, and GitHub delays scheduled runs (gaps of 13+ hours
    # were seen on the old 6-hour schedule); :17 avoids the on-the-hour rush.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app in a real browser
        run: python .github/scripts/keep_app_awake.py
