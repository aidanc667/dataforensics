[project]
name = "dataforensics"
version = "0.1.0"
description = "Auditable profiling, validation, and rules-driven harmonization for messy research tabular exports."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "charset-normalizer>=3.3",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "xlwt>=1.3", "ruff>=0.16", "mypy>=1.13"]
viewer = ["streamlit>=1.30"]

[project.scripts]
dataforensics = "dataforensics.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "ISC", "DTZ", "BLE"]
ignore = [
    # BLE001: this codebase deliberately catches a broad Exception at UI
    # validation boundaries (e.g. app.py's Step 4 Apply handler) so a bad
    # rules file or malformed upload surfaces as a Streamlit error message
    # instead of crashing the app -- not an accident to be narrowed.
    "BLE001",
]

[tool.mypy]
python_version = "3.11"
files = ["src/dataforensics"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Third-party PEP 561 packages (numpy, pulled in transitively via openpyxl)
# ship stubs that use newer-Python-only syntax than our 3.11 floor, which
# breaks mypy's parser before it ever reaches our own code. We don't rely on
# third-party stub precision here (ignore_missing_imports is already on), so
# skip site-packages lookups entirely rather than pin to a narrower stub set.
no_site_packages = true
